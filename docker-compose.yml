services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-shadowboxing
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-mock_key_for_dev}
      - TAVUS_API_KEY=${TAVUS_API_KEY:-mock_key_for_dev}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
